name: Mutation Testing

# Manual run: Actions → Mutation Testing → Run workflow.
# Claude runs the `mutation-testing` skill (.agents/skills/mutation-testing) against the backend:
# it plants one bug at a time, runs the tests, reverts, and writes a report.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Backend class or package to mutate"
        default: "OrderService"
        required: true
      count:
        description: "Number of mutants (max 25)"
        default: "10"
        required: true

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Download dependencies once so the skill's `--offline` test runs work.
      - name: Warm up Gradle
        working-directory: apps/backend
        run: ./gradlew testClasses

      - name: Run mutation testing
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /mutation-testing ${{ inputs.target }} ${{ inputs.count }}

            You are running in CI with nobody watching. Do not ask questions and do not offer to write tests.
            Do not commit or push. Finish with the report written to apps/backend/build/mutation-testing/report.md.
          claude_args: '--allowedTools "Read,Edit,Write,Glob,Grep,Bash"'
          show_full_output: true

      - name: Publish report to job summary
        if: always()
        run: |
          REPORT=apps/backend/build/mutation-testing/report.md
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; else echo "No report was written." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload mutation-testing output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-${{ inputs.target }}
          path: apps/backend/build/mutation-testing/
          if-no-files-found: warn

      - name: Check working tree was restored
        if: always()
        run: git diff --exit-code -- apps/backend/src
