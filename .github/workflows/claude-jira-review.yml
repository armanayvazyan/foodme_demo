name: Claude Jira Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-jira-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            PR: ${{ github.repository }}#${{ github.event.pull_request.number }}  
            Title: ${{ github.event.pull_request.title }}        
            Get the Jira key (format `KAN-<n>`) from the title.   
            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Don't use git diff: the checkout is shallow.                                  
            Fetch the ticket with jira_get_issue and compare: what's done, what's missing, anything extra.                                                        
            Write the result to a file and post it with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.      
            add into PR comment the results
          claude_args: '--allowedTools "mcp__mcp-atlassian__jira_get_issue,Bash(gh pr view:*),Bash(gh pr comment:*),Write,Bash(gh pr diff:*),"'

