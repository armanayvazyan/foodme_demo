name: Claude Jira Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-jira-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Take title of PR. From title get the jira issue number which has following format: `KAN-XXXX`
            Take the branch diff against main. Fetch Jira ticket with the jira_get_issue tool and compare: 
            what's done, what's missing, anything extra?
            add into PR comment the results
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__mcp-atlassian__jira_get_issue,Bash(gh pr view:*),Bash(gh pr list:*)"'

