# Automated PR review by Claude Code, for the agentic-QA course demo.
#
# Required repo secret:
#   CLAUDE_CODE_OAUTH_TOKEN — generated locally with `claude setup-token`.
#   Add it under Settings > Secrets and variables > Actions > New repository
#   secret, named exactly CLAUDE_CODE_OAUTH_TOKEN. Without it this workflow
#   will fail at the claude-code-action step.
#
# Comments are posted as claude[bot]: the action exchanges an OIDC token for a
# Claude GitHub App token. That exchange only works when this file is
# identical to the copy on main, so a PR that edits this file gets "Workflow
# validation failed" and skips the review until the change is merged.
#
# In agent mode (a `prompt` is set) the action posts nothing by itself: Claude
# has to call `gh pr comment` / the inline comment tool, so the prompt says so
# and those tools are in --allowedTools.
#
# Quality gate: the job fails when Claude reports findings. --json-schema makes
# it return {issues_found, issue_count, summary}, and the last step checks it.
# A PR that edits this file passes with a warning, since the review is skipped.
#
# Permissions are scoped to the minimum the action needs:
#   contents: read        — checkout / read the repo at the PR ref
#   pull-requests: write  — post review comments on the PR
#   id-token: write       — OIDC token for the action's auth flow
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, security issues, and
            adherence to the FoodMe repo conventions (CLAUDE.md and
            .agents/rules/*.md). Read the diff with `gh pr diff`.

            - For a problem on a specific line, leave an inline comment with
              mcp__github_inline_comment__create_inline_comment.
            - Then post ONE summary comment with
              `gh pr comment ${{ github.event.pull_request.number }} --body "..."`:
              overall verdict, then findings ranked by severity. Call out
              anything that looks like a real bug or security risk.

            You MUST post the summary comment, even if you find nothing.

            Return issues_found = true if you posted any finding that should
            be fixed before merge (bug, security risk, convention violation).
            Pure style nits or questions don't count.
          include_fix_links: true
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"issues_found":{"type":"boolean"},"issue_count":{"type":"integer"},"summary":{"type":"string"}},"required":["issues_found","issue_count","summary"]}'

      - name: Fail if the review found issues
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
          WORKFLOW_FILE: .github/workflows/claude-pr-review.yml
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$RESULT" ]; then
            # The action skips itself when this file differs from main.
            if ! git diff --quiet "origin/$DEFAULT_BRANCH" HEAD -- "$WORKFLOW_FILE"; then
              echo "::warning::This PR edits $WORKFLOW_FILE, so the review was skipped. Gate passes."
              exit 0
            fi
            echo "::error::Claude returned no structured result"
            exit 1
          fi
          echo "$RESULT" | jq .
          if [ "$(echo "$RESULT" | jq -r .issues_found)" = "true" ]; then
            echo "::error::Claude review found $(echo "$RESULT" | jq -r .issue_count) issue(s), see the PR comments"
            exit 1
          fi
