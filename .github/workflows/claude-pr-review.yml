name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} for bugs, security
            issues and violations of CLAUDE.md and .agents/rules/*.md.
            Read the diff with `gh pr diff`. Post ONE comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`:
            verdict, then findings ranked by severity.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*)"
