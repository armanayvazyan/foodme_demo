# Automated PR review by Claude Code, for the agentic-QA course demo.
#
# Required repo secret:
#   ANTHROPIC_API_KEY — an Anthropic API key with access to the model used
#   for review. Add it under Settings > Secrets and variables > Actions >
#   New repository secret, named exactly ANTHROPIC_API_KEY. Without it this
#   workflow will fail at the claude-code-action step.
#
# Permissions are scoped to the minimum the action needs to read the PR
# diff, post review comments, and mint the OIDC token it uses for
# short-lived credential exchange:
#   contents: read       — checkout / read the repo at the PR ref
#   pull-requests: write  — post review comments on the PR
#   id-token: write        — OIDC token for the action's auth flow
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for correctness, security issues, and
            adherence to the FoodMe repo conventions. Summarize findings and
            call out anything that looks like a real bug or security risk.
          include_fix_links: true
