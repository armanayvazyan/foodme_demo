name: Claude Mutation Testing

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-mutation-testing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MARKER: "<!-- claude-mutation-testing -->"
      MUTATION_DIR: ${{ github.workspace }}/.mutation
      MUTATION_THRESHOLD: ${{ vars.MUTATION_THRESHOLD || '80' }}
      MAX_MUTANTS: ${{ vars.MAX_MUTANTS || '30' }}
      SCRIPTS: .agents/skills/mutation-testing/scripts

    steps:
      - name: Mark the gate as pending
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context="Mutation Testing Gate" \
            -f description="Waiting for Claude Mutation Testing" > /dev/null

      # The PR head, not the merge commit, so the report's sha matches the PR's latest commit.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Find the changed production code
        id: scope
        run: |
          mkdir -p "$MUTATION_DIR"
          bash "$SCRIPTS/scope.sh" "$BASE_SHA" > "$MUTATION_DIR/scope.txt"
          echo "Files in scope:"; cat "$MUTATION_DIR/scope.txt"
          for m in backend web admin; do
            if grep -q "^apps/$m/" "$MUTATION_DIR/scope.txt"; then echo "$m=true"; else echo "$m=false"; fi
          done >> "$GITHUB_OUTPUT"
          if [ -s "$MUTATION_DIR/scope.txt" ]; then echo "any=true"; else echo "any=false"; fi >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.scope.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.scope.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.admin == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json

      - name: Install web dependencies
        if: steps.scope.outputs.web == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Install admin dependencies
        if: steps.scope.outputs.admin == 'true'
        working-directory: apps/admin
        run: npm ci

      # Mutants only mean something against a green suite. The baseline also sets each
      # module's per-mutant timeout.
      - name: Run the unmutated unit tests
        id: baseline
        if: steps.scope.outputs.any == 'true'
        run: |
          green=""
          for m in backend web admin; do
            grep -q "^apps/$m/" "$MUTATION_DIR/scope.txt" || continue
            result=$(bash "$SCRIPTS/run-tests.sh" "$m" baseline | tail -n1)
            echo "$m baseline: $result"
            if [ "$result" != "RESULT: SURVIVED" ]; then
              echo "The $m unit tests fail without any mutant ($result). Fix them before mutation testing." >> "$MUTATION_DIR/error.txt"
              echo "::error::$m baseline is not green"; tail -n 60 "$MUTATION_DIR/logs/$m-baseline.log"
            else
              green="$green $m"
            fi
          done
          echo "green=${green# }" >> "$GITHUB_OUTPUT"
          if [ -f "$MUTATION_DIR/error.txt" ]; then echo "ok=false"; else echo "ok=true"; fi >> "$GITHUB_OUTPUT"

      - name: Run Claude Mutation Testing
        id: claude-mutation-testing
        if: steps.baseline.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run mutation testing on PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }} with the skill mutation-testing.
            Base SHA: ${{ env.BASE_SHA }}. HEAD is the PR head.
            MUTATION_DIR is ${{ env.MUTATION_DIR }}. The files in scope are in ${{ env.MUTATION_DIR }}/scope.txt.
            The baseline already ran and is green for: ${{ steps.baseline.outputs.green }}. Don't run it again.
            Budget: at most ${{ env.MAX_MUTANTS }} scored mutants.
            Run every mutant with the skill's run-tests.sh, revert it, and keep ${{ env.MUTATION_DIR }}/mutants.json up to date.
            Don't build the report and don't post anything to the PR. The workflow does that.
          claude_args: '--allowedTools "Skill,Read,Glob,Grep,Edit,Write,Bash(git diff:*),Bash(git status:*),Bash(git checkout:*),Bash(git show:*),Bash(bash .agents/skills/mutation-testing/scripts/run-tests.sh:*)"'

      - name: Check that every mutant was reverted
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- apps)" ]; then
            echo "::warning::A mutant was left in the working tree:"; git status --porcelain -- apps
            git checkout -- apps
          fi

      # Counts, score and pass/fail come from the harness results, never from the agent.
      - name: Build the report
        if: always()
        run: |
          node "$SCRIPTS/report.mjs" finalize --dir "$MUTATION_DIR" --sha "$HEAD_SHA" --pr "$PR" \
            --threshold "$MUTATION_THRESHOLD" --scope "$MUTATION_DIR/scope.txt"
          cat "$MUTATION_DIR/mutation-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            .mutation/mutation-report.json
            .mutation/mutation-report.md
            .mutation/mutants.json
            .mutation/scope.txt
            .mutation/results/
            .mutation/patches/
            .mutation/logs/
          include-hidden-files: true
          if-no-files-found: warn

      # One report comment per PR: edit it if it exists, create it otherwise.
      - name: Post or replace the report comment
        if: always() && steps.claude-mutation-testing.outcome != 'cancelled'
        run: |
          report="$MUTATION_DIR/mutation-report.md"
          if [ ! -s "$report" ]; then
            printf '## 🧬 Mutation testing\n\n**Result:** ❌ The run did not produce a report. Re-run the job.\n' > "$report"
          fi
          { echo "$MARKER"; echo "<!-- sha: $HEAD_SHA -->"; echo; cat "$report"; } > body.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
