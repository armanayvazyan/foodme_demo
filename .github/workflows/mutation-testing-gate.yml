name: Mutation Testing Gate

# Passes only when the mutation score for the PR's latest commit reaches the threshold
# (repo variable MUTATION_THRESHOLD, default 80). It runs after the mutation workflow,
# recomputes the score from the report artifact with main's copy of report.mjs, and
# reports a "Mutation Testing Gate" commit status, which branch protection on main can require.
on:
  workflow_run:
    workflows: ["Claude Mutation Testing"]
    types: [completed]

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      MUTATION_THRESHOLD: ${{ vars.MUTATION_THRESHOLD || '80' }}

    steps:
      # Default branch, not the PR: the gate's logic can't be changed by the PR it judges.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .agents/skills/mutation-testing/scripts

      - name: Check the mutation report
        run: |
          set_status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" -f context="Mutation Testing Gate" -f description="${2:0:140}" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /dev/null
          }

          if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n mutation-report -D report; then
            set_status failure "No mutation report artifact"
            echo "::error::Run $RUN_ID has no mutation-report artifact"; exit 1
          fi

          rc=0
          reason=$(node .agents/skills/mutation-testing/scripts/report.mjs gate \
            --report report/mutation-report.json --sha "$HEAD_SHA" --threshold "$MUTATION_THRESHOLD") || rc=$?
          echo "$reason"
          [ -f report/mutation-report.md ] && cat report/mutation-report.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            set_status failure "$reason"
            echo "::error::$reason"; exit 1
          fi
          set_status success "$reason"
