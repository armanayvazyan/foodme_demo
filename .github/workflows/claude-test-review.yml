name: Claude Test Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-test-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-test-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MARKER: "<!-- claude-test-review -->"
      REPORT: test-review-report.md

    steps:
      - name: Mark the gate as pending
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context="Test Review Gate" \
            -f description="Waiting for Claude Test Review" > /dev/null

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Re-runs must not pile up comments: drop the inline comments from the previous review.
      - name: Delete previous inline comments
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/pulls/comments/$id" \
              || echo "::warning::Could not delete inline comment $id"
          done

      - name: Run Claude Test Review
        id: claude-test-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            here is PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            it need to be reviewed by skill test-review
            after reviewing add inline comments on tests which need to be modified,
            and write the report (with the tests which need to be added) to ${{ env.REPORT }} using the skill's templates.
            Do not post the report as a PR comment yourself.
          claude_args: '--allowedTools "Skill,Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"'

      # One report comment per PR: edit it if it exists, create it otherwise.
      # The hidden sha line lets the gate reject a report for an older commit.
      - name: Post or replace the report comment
        if: always() && steps.claude-test-review.outcome != 'cancelled'
        run: |
          if [ ! -s "$REPORT" ]; then
            printf '## 🧪 Test review\n\n**Result:** ❌ The review did not produce a report. Re-run the job.\n' > "$REPORT"
          fi
          { echo "$MARKER"; echo "<!-- sha: $HEAD_SHA -->"; echo; cat "$REPORT"; } > body.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
