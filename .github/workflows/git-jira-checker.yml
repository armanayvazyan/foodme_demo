# Compares a PR's diff with the Jira ticket named in its title (KAN-<n>) and
# comments the result on the PR.
#
# Required repo secrets: CLAUDE_CODE_OAUTH_TOKEN, JIRA_API_TOKEN.
#
# Jira is reached through the mcp-atlassian MCP server, configured inline
# below (the project .mcp.json also lists servers that can't start in CI).
# Comments are posted as claude[bot]; see the note in claude-pr-review.yml
# about edits to this file only taking effect once they're on main.
#
# The job fails when the ticket isn't fully covered: --json-schema makes Claude
# return {issues_found, missing_count, extra_count, summary}, and the last step
# checks it.
name: Check Git Diff vs Jira Issue

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check
        required: true
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv (runs mcp-atlassian via uvx)
        uses: astral-sh/setup-uv@v6

      - name: Write Jira MCP config
        run: |
          cat > "$RUNNER_TEMP/jira-mcp.json" <<'EOF'
          {
            "mcpServers": {
              "mcp-atlassian": {
                "command": "uvx",
                "args": ["mcp-atlassian"],
                "env": {
                  "JIRA_URL": "https://foodme-armanayvazyan.atlassian.net",
                  "JIRA_USERNAME": "ayvazyan.a.arman@gmail.com",
                  "JIRA_API_TOKEN": "${JIRA_API_TOKEN}"
                }
              }
            }
          }
          EOF

      - name: Run Claude Code vs Jira Implementation Review
        id: jira
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            1. Get the PR title and branch with `gh pr view ${{ env.PR_NUMBER }}`.
               Extract the Jira key (format `KAN-<n>`) from the title, or from
               the branch name if the title has none.
            2. Get the PR diff with `gh pr diff ${{ env.PR_NUMBER }}`.
            3. Fetch the ticket with mcp__mcp-atlassian__jira_get_issue.
            4. Compare the diff with the ticket's description and acceptance
               criteria: what's done, what's missing, anything extra (changes
               the ticket doesn't ask for).
            5. Post the result as ONE comment with
               `gh pr comment ${{ env.PR_NUMBER }} --body "..."`, using the
               headings: Jira ticket (key + link), Done, Missing, Extra, Verdict.

            You MUST post the comment. If no Jira key is found or the ticket
            can't be fetched, post a comment that says so and why.

            Return issues_found = true if anything is Missing or Extra, or if
            the ticket couldn't be found or fetched.
          claude_args: |
            --mcp-config ${{ runner.temp }}/jira-mcp.json
            --allowedTools "Read,Glob,Grep,mcp__mcp-atlassian__jira_get_issue,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"issues_found":{"type":"boolean"},"missing_count":{"type":"integer"},"extra_count":{"type":"integer"},"summary":{"type":"string"}},"required":["issues_found","missing_count","extra_count","summary"]}'
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Fail if the PR doesn't match the ticket
        env:
          RESULT: ${{ steps.jira.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::Claude returned no structured result"
            exit 1
          fi
          echo "$RESULT" | jq .
          if [ "$(echo "$RESULT" | jq -r .issues_found)" = "true" ]; then
            echo "::error::PR vs Jira: $(echo "$RESULT" | jq -r .missing_count) missing, $(echo "$RESULT" | jq -r .extra_count) extra, see the PR comment"
            exit 1
          fi
