name: Check Git Diff vs Jira Issue

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code vs Jira Implementaion Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Take title of PR. From title get the jira issue number which has following format: `KAN-XXXX`
            Take the branch diff against main. Fetch Jira ticket with the jira_get_issue tool and compare: 
            what's done, what's missing, anything extra?
            add into PR comment the results
          include_fix_links: true
          claude_args: '--allowedTools "mcp__mcp-atlassian__jira_get_issue"'
