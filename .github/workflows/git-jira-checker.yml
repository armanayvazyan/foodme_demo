# Compares the PR diff against the Jira ticket named in the PR title and
# posts the result as a PR comment. Runs the Claude Code CLI directly
# (no claude-code-action).
#
# Required repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — generated locally with `claude setup-token`.
#   JIRA_USERNAME           — Atlassian account email.
#   JIRA_API_TOKEN          — https://id.atlassian.com/manage-profile/security/api-tokens
name: Check Git Diff vs Jira Issue

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v6

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: |
          cat > "$RUNNER_TEMP/mcp.json" <<'EOF'
          {
            "mcpServers": {
              "mcp-atlassian": {
                "command": "uvx",
                "args": ["mcp-atlassian"],
                "env": {
                  "JIRA_URL": "${JIRA_URL}",
                  "JIRA_USERNAME": "${JIRA_USERNAME}",
                  "JIRA_API_TOKEN": "${JIRA_API_TOKEN}"
                }
              }
            }
          }
          EOF

      - name: Run Claude Code vs Jira Implementation Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          JIRA_URL: https://foodme-armanayvazyan.atlassian.net
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          claude -p "$(cat <<EOF
          You are reviewing pull request #${PR_NUMBER} in this repository.
          PR title: ${PR_TITLE}

          From the PR title get the Jira issue key, which has the format \`KAN-XXXX\`.
          Take the branch diff with \`git diff origin/${BASE_REF}...HEAD\`.
          Fetch the Jira ticket with the jira_get_issue tool and compare it to the diff.
          Then post one comment on the PR with \`gh pr comment ${PR_NUMBER} --body-file <file>\`
          covering: what's done, what's missing, anything extra.
          If the title has no Jira key, post a comment saying so and stop.
          EOF
          )" \
            --mcp-config "$RUNNER_TEMP/mcp.json" \
            --allowedTools "mcp__mcp-atlassian__jira_get_issue,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Read,Write,Grep,Glob" \
            --output-format text
