# Compares a PR's diff with the Jira ticket in its title (KAN-<n>) and comments
# the result on the PR, as claude[bot].
#
# Required repo secrets: CLAUDE_CODE_OAUTH_TOKEN, JIRA_API_TOKEN.
# Jira comes from the mcp-atlassian server in the root .mcp.json (run with uvx).
# Edits to this file only take effect once they're on main.
name: Check Git Diff vs Jira Issue

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Compare PR with Jira ticket
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Get the PR title with `gh pr view` and extract the Jira key (`KAN-<n>`).
            2. Fetch the ticket with mcp__mcp-atlassian__jira_get_issue.
            3. Get the PR diff with `gh pr diff`.
            4. Compare them: what's done, what's missing, anything extra.
            5. Post ONE comment with `gh pr comment`, headings: Jira ticket
               (key + link), Done, Missing, Extra, Verdict. If the key or the
               ticket can't be found, post a comment saying so.
          claude_args: |
            --allowedTools "mcp__mcp-atlassian__jira_get_issue,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
