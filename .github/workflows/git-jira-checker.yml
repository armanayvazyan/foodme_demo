# Compares the PR diff with the Jira ticket (KAN-<n>) in the PR title.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN, JIRA_API_TOKEN. Jira via mcp-atlassian in .mcp.json (uvx).
name: Check Git Diff vs Jira Issue

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > pr.diff

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            PR title: ${{ github.event.pull_request.title }}
            Fetch the Jira ticket named in the title (KAN-<n>) with
            mcp__mcp-atlassian__jira_get_issue, compare it with pr.diff and write
            your comment with headings: Jira ticket (key + link), Done, Missing,
            Extra, Verdict. If the ticket can't be found, say so.
          claude_args: |
            --allowedTools "mcp__mcp-atlassian__jira_get_issue"
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
