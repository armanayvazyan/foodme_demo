# Compares a PR's diff with the Jira ticket named in its title (KAN-<n>) and
# comments the result on the PR.
#
# Required repo secrets: CLAUDE_CODE_OAUTH_TOKEN, JIRA_API_TOKEN.
#
# Jira is reached through the mcp-atlassian MCP server from the root
# .mcp.json (run with uvx, hence setup-uv). The other servers there can't
# start in CI; that's harmless.
# Comments are posted as claude[bot]; see the note in claude-pr-review.yml
# about edits to this file only taking effect once they're on main.
#
# The job fails when the ticket isn't fully covered: --json-schema makes Claude
# return {issues_found, missing_count, extra_count, summary}, and the last step
# checks it.
name: Check Git Diff vs Jira Issue

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check
        required: true
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv (runs mcp-atlassian via uvx)
        uses: astral-sh/setup-uv@v6

      - name: Run Claude Code vs Jira Implementation Review
        id: jira
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            1. Get the PR title and Extract the Jira key (format `KAN-<n>`) from the title
            2. Get the PR diff
            3. Fetch the ticket with jira_get_issue tool.
            4. Compare the diff with the ticket's description and acceptance
               criteria: what's done, what's missing, anything extra (changes
               the ticket doesn't ask for).
            5. Post the result as ONE comment into PR
               headings: Jira ticket (key + link), Done, Missing, Extra, Verdict.

            You MUST post the comment. If no Jira key is found or the ticket
            can't be fetched, post a comment that says so and why.

            Return issues_found = true if anything is Missing or Extra, or if
            the ticket couldn't be found or fetched.
          claude_args: |
            --allowedTools "mcp__mcp-atlassian__jira_get_issue,mcp__github_inline_comment__create_inline_comment"
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}