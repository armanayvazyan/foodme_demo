# Compares a PR's diff with the Jira ticket in its title (KAN-<n>) and comments
# the result on the PR, as claude[bot].
#
# Required repo secrets: CLAUDE_CODE_OAUTH_TOKEN, JIRA_API_TOKEN.
# Jira comes from the mcp-atlassian server in the root .mcp.json (run with uvx).
# track_progress makes the action post the comment itself; Claude fills it in.
# The PR title and diff are handed to Claude, so it needs no gh CLI.
# Edits to this file only take effect once they're on main.
name: Check Git Diff vs Jira Issue

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-jira-implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Write PR diff
        run: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Compare PR with Jira ticket
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            PR title: ${{ github.event.pull_request.title }}
            PR diff: the file pr.diff in the working directory.

            1. Extract the Jira key (`KAN-<n>`) from the PR title.
            2. Fetch the ticket with mcp__mcp-atlassian__jira_get_issue.
            3. Read pr.diff and compare it with the ticket: what's done,
               what's missing, anything extra.
            4. Write the result into your PR comment, headings: Jira ticket
               (key + link), Done, Missing, Extra, Verdict. If the key or the
               ticket can't be found, say so.

            Don't change any files.
          claude_args: |
            --allowedTools "mcp__mcp-atlassian__jira_get_issue"
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
