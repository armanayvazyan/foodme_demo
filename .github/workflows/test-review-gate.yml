name: Test Review Gate

# Passes only when the Claude Test Review report for the PR's latest commit says "✅ Everything passed".
# It runs after the review workflow and reports a "Test Review Gate" commit status on the PR,
# which branch protection on main can require.
on:
  workflow_run:
    workflows: ["Claude Test Review"]
    types: [completed]

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      MARKER: "<!-- claude-test-review -->"
      PASS_LINE: "✅ Everything passed"

    steps:
      - name: Check the test review report
        run: |
          set_status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" -f context="Test Review Gate" -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          }

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            set_status failure "No pull request found for $HEAD_SHA"
            echo "::error::No pull request found for $HEAD_SHA"; exit 1
          fi

          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -n1)
          : > report.md
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body > report.md
          fi

          if [ ! -s report.md ]; then
            set_status failure "No test review report on the PR"
            echo "::error::No test review report found on PR #$pr"; exit 1
          fi
          if ! grep -qF "<!-- sha: $HEAD_SHA -->" report.md; then
            set_status failure "Test review report is for an older commit"
            echo "::error::The report on PR #$pr is not for $HEAD_SHA"; exit 1
          fi
          if ! grep -qxF "$PASS_LINE" report.md; then
            set_status failure "Test review found issues"
            echo "::error::Test review found issues. See the report comment on PR #$pr."
            cat report.md; exit 1
          fi

          set_status success "Everything passed"
          echo "Test review gate passed for PR #$pr"
